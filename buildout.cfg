[buildout]
index = https://pypi.org/simple/
extends = https://dist.plone.org/release/5.2.15/versions.cfg
find-links =
    https://dist.plone.org/release/5.2.15/
    https://dist.plone.org/thirdparty/

parts =
    instance
    test

package-name = senaite.starter
senaite-user = admin:admin

eggs =
    senaite.lims
    ${buildout:package-name}

develop = .

[instance]
recipe = plone.recipe.zope2instance
http-address = 0.0.0.0:8080
user = ${buildout:senaite-user}
wsgi = on
eggs =
    ${buildout:eggs}

[test]
recipe = zc.recipe.testrunner
defaults = ['--auto-color', '--auto-progress']
eggs =
    ${buildout:package-name} [test]


[versions]
# The SENAITE packages depend on each other with lower bounds only, so
# pinning senaite.lims alone leaves the rest free to resolve to any
# newer release. Pin the set.
senaite.lims = 2.6.0
senaite.core = 2.6.0
senaite.app.listing = 2.6.0
senaite.app.spotlight = 2.6.0
senaite.app.supermodel = 2.6.0
senaite.impress = 2.6.0
senaite.jsonapi = 2.6.0

Werkzeug = 1.0.1
cairocffi = 0.9.0
cssselect2 = 0.2.2
et-xmlfile = 1.1.0
more-itertools = 5.0.0
pdfrw = 0.4
tinycss2 = 0.6.1
unittest2 = 1.1.0

# Required by:
# senaite.core==2.6.0
